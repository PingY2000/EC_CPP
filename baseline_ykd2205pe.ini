# ============================================================================
# slide_motion 参数基线 - YKD2205PE 滑台驱动器
#
# 这份文件由  --dump-baseline  现场导出后人工审定而成: 导出时**全部不带 '!'**,
# 下面的 '!' 是人读完之后手工加上去的。改任何一条前请先读这段。
#
# 用法:
#   slide_motion <ifname> --baseline=baseline_ykd2205pe.ini
#
# 行首 '!' 的含义:
#   '!'   = 必需项。不匹配 -> FAIL, 且退出码 3。
#   无 '!' = 参考项。不匹配 -> WARN, 退出码 4, 不阻塞动作。
#
# 另有第三档, 由工具的代码而不是本文件决定 (见 sm_spec_table[] 的 dangerous 列):
#   带 dangerous 标记的对象一旦漂移, 工具会**拒绝执行 S3/S4**(退出码 6), 因为
#   这些参数直接决定"命令的语义", 它们不对时动作结论没有意义。带 dangerous 的是:
#     2310h~2313h (输入功能定义)、2201h+2400h+2408h+2409h (行程当量)、2204h (超程停车)。
#   dangerous 与 '!' 无关: 上面这几项即使在本文件里没写 '!', 漂移也照样挡动作。
#   换句话说, 本文件里 '!' 是"这是验收要求的", dangerous 是"错了就不能动"。
#
# [meta] 与现场设备不一致 -> 退出码 8 (基线不属于这台设备, 比对无意义)
# 本文件取自: 总线位置 0/1 两台 YKD2205PE (厂商 0x0994 / 产品 0x3000 / 修订 0x1)
# ============================================================================

[meta]
vendor_id    = 0x00000994
product_code = 0x00003000

[motion]
# 微动默认参数。命令行 --jog/--vel/--accel 会覆盖这里的值, 且一律受硬上限约束。
# 这里是保守默认: 200 脉冲 @ 500 脉冲/s, 理论动作时间约 0.5s/腿。
# 首次真动请用更小的 --jog=50 --vel=300。
jog_pulses    = 200
jog_velocity  = 500
jog_accel     = 5000
tolerance_pct = 5


# ----------------------------------------------------------------------------
# 位置 0
# ----------------------------------------------------------------------------
[axis.0]

# ---- 输入功能定义: 决定 60FDh 每一位是什么线, 也决定限位保护是否真的存在 ----
# 现场实测: X0=1(原点) X1=2(正限位) X2=3(负限位) X3=0(未用)
# 这是最关键的一组参数: 如果 X1/X2 被改成别的功能, 60FDh 的限位位就不再反映
# 真实限位开关, 用限位做安全边界的自动流程会带着错误的保护继续跑。
! 2310h = 1
! 2311h = 2
! 2312h = 3
! 2313h = 0

# ---- 行程当量: 决定"1 个脉冲 = 多少位移", 也决定行程断言是否成立 ----
# 这一组里 2201h 是总开关, 它决定下面两套里哪一套说了算:
#   2201h = 0 (手册默认) -> 当量 = 2400h 细分, 本机实测 50000 脉冲/圈
#   2201h = 1            -> 当量 = 2408h/2409h 电子齿轮比
# 两套差 50 倍。任何一项漂移, 同样的 --jog=N 都会走到完全不同的物理位置。
#
# 2201h 这个值**是按手册默认填的假设, 不是本机实测** —— 见
# docs/ykd2205pe_ci402.md 与 docs/scan_sweep.md 里"未验证"那一节。跑 motor_test
# (只读, 不需要任何 --allow*) 会把它连宽度一起打出来, 量到之后把它改成 '!'。
# 之所以敢在这里先写个假设值: 它在 sm_spec_table 里是 dangerous 的, 所以真值
# 只要不是 0 就会**直接挡动作**并告诉你该去量 —— 报"参数不对"总好过静默地按
# 50 倍错的当量去扫。
  2201h = 0
! 2400h = 50000
! 2408h = 1000
! 2409h = 4000

# ---- 超程保护方式 ----
! 2204h = 0

# ---- IO 电平逻辑与滤波 (反相会让 60FDh 的限位位读反, 记 WARN 不阻塞) ----
  2300h = 0
  2301h = 0
  2320h = 0
  2321h = 0
  2330h = 2
  2331h = 2
  2332h = 2
  2333h = 2

# ---- 电流与增益: 随负载/整定可调, 只作参考 ----
  2401h = 2000
  2402h = 40
  2404h = 100
  2405h = 40
  2406h = 100
  2500h = 10260
  2501h = 2367
  2502h = 3276
  2503h = 112

# ---- 软限位 (对象存在且可读) ----
# 现场值 ±2000000000 = 实际上等于"没有软限位" (远超机械行程)。
# 刻意不加 '!': 如果哪天有人把它收紧成真实行程, 那是**更安全**的改动,
# 不该被基线判 FAIL。preflight 每次都会读它们并检查目标位置是否越界。
  607Dh:01 = -2000000000
  607Dh:02 = 2000000000

# ---- 回零: 本工具不做回零, 只记录 ----
  6098h = 17
  6099h:01 = 50000
  6099h:02 = 10000
  609Ah = 500000
  607Ch = 0

# ---- PP 参数: 微动期间会被临时改写, 收尾恢复 ----
# 6081h = 0 表示"PP 速度从未设过", 新机属正常。
# (它读得出来, 所以 slide_verify 并不因此报 WARN —— 那一项是可选对象, 只在缺失/超时时记 WARN。)
# 不加 '!': 它是这次要临时改的对象, 基线固定它没有意义。
  6081h = 0
  6083h = 500000
  6084h = 500000
  60FFh = 0


# ----------------------------------------------------------------------------
# 位置 1
# ----------------------------------------------------------------------------
[axis.1]

! 2310h = 1
! 2311h = 2
! 2312h = 3
! 2313h = 0

# 行程当量四条 —— 解释见上面 [axis.0] 那一段, 两轴取同样的值。
  2201h = 0
! 2400h = 50000
! 2408h = 1000
! 2409h = 4000

! 2204h = 0

  2300h = 0
  2301h = 0
  2320h = 0
  2321h = 0
